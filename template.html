<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SIDC Daily Overview V2</title>
<style>
:root{
  --bg:#f3f5f8; --card:#ffffff; --ink:#141820; --muted:#566170; --faint:#8a939f; --line:#e2e6ec; --soft:#f0f3f7;
  --accent:#1f5fbf; --accent-bg:#e4edfb;
  --ok:#157a46; --ok-bg:#dff3e7; --warn:#a86400; --warn-bg:#fdf0d8; --bad:#c22f2f; --bad-bg:#fbe4e2; --bad-bg2:#f3bdb7; --na:#7b8593; --na-bg:#eef1f4;
  --s-yes:#4f7fd1; --s-workshop:#5fa79b; --s-scheduled:#d9a441; --s-home:#a9b0bb;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 6px rgba(16,24,40,.05);
  --sel:#dfe9fb; --sel-detail:#f4f8fe;
  --nav-h:96px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0d11; --card:#1b2029; --ink:#eef1f5; --muted:#adb6c2; --faint:#87909c; --line:#333b48; --soft:#252c37;
    --accent:#7aaaff; --accent-bg:#22314d;
    --ok:#5ccf95; --ok-bg:#1a3a2b; --warn:#f0b34f; --warn-bg:#3e2f14; --bad:#ff8379; --bad-bg:#45232a; --bad-bg2:#6b2b30; --na:#8d96a3; --na-bg:#272e38;
    --s-yes:#5b86cf; --s-workshop:#4d8f86; --s-scheduled:#b8913f; --s-home:#5e6673;
    --shadow:0 0 0 1px rgba(255,255,255,.03),0 4px 14px rgba(0,0,0,.4);
    --sel:#2b3d5e; --sel-detail:#212a39;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0d11; --card:#1b2029; --ink:#eef1f5; --muted:#adb6c2; --faint:#87909c; --line:#333b48; --soft:#252c37;
  --accent:#7aaaff; --accent-bg:#22314d;
  --ok:#5ccf95; --ok-bg:#1a3a2b; --warn:#f0b34f; --warn-bg:#3e2f14; --bad:#ff8379; --bad-bg:#45232a; --bad-bg2:#6b2b30; --na:#8d96a3; --na-bg:#272e38;
  --s-yes:#5b86cf; --s-workshop:#4d8f86; --s-scheduled:#b8913f; --s-home:#5e6673;
  --shadow:0 0 0 1px rgba(255,255,255,.03),0 4px 14px rgba(0,0,0,.4);
  --sel:#2b3d5e; --sel-detail:#212a39;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 12px)}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1480px;margin:0 auto;padding:18px 20px 48px}
.num,td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.hint{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px}
[hidden]{display:none !important}

/* header */
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:10px}
.top h1{font-size:22px;margin:0;letter-spacing:-.01em}
.meta{color:var(--muted);font-size:13px;margin-top:3px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);font-size:12px;font-weight:600}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:6px 11px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:650}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 11px;font-size:13px;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.small{padding:3px 9px;font-size:12px}
.stale{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:10px;padding:8px 12px;margin:0 0 10px;font-weight:600}

/* sticky nav + filters */
.sticky{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);margin:0 -20px 14px;padding:8px 20px 8px;border-bottom:1px solid var(--line)}
.nav{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.nav a{padding:6px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:600;font-size:13.5px}
.nav a:hover{background:var(--soft);color:var(--ink)}
.nav a.active{background:var(--accent-bg);color:var(--accent)}
.nav .cnt{display:inline-block;min-width:18px;margin-left:5px;padding:0 6px;border-radius:999px;background:var(--bad-bg);color:var(--bad);font-size:11.5px;text-align:center}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filters label{font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:1px}
.filters select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 6px;font-size:13px;min-width:110px;max-width:180px}
.filters .chk{flex-direction:row;align-items:center;gap:6px;font-size:13px;color:var(--ink);padding-top:12px}
@media (max-width:900px){.sticky{position:static}}

/* sections */
main > section{margin-top:18px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:0 0 10px}
.sec-head h2{font-size:18px;margin:0;letter-spacing:-.01em}
.sec-head .hint{margin:2px 0 0}
.grid{display:grid;gap:12px}
.two{grid-template-columns:1.25fr 1fr}
@media (max-width:1100px){.two{grid-template-columns:1fr}}
.grid > *{min-width:0}

/* KPI */
.kpis{display:grid;gap:10px;grid-template-columns:repeat(5,minmax(0,1fr))}
.kpis.secondary{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:10px}
.kpi{padding:12px 14px}
.kpi .l{color:var(--muted);font-size:12.5px;display:flex;gap:6px;align-items:center}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .n{font-size:12px;color:var(--faint);min-height:16px}
.kpis.secondary .kpi .v{font-size:20px}
.kpi.bad{border-color:var(--bad)} .kpi.bad .v{color:var(--bad)}
.kpi.warn .v{color:var(--warn)}
.kpi.info{border-color:var(--accent)} .kpi.info .v{color:var(--accent)}
.kpi.mgmtk{border-style:dashed}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.layout-visual .kpi{padding:16px 18px;border-radius:16px}
.layout-visual .kpi .v{font-size:36px}
.layout-visual .kpi .ico{font-size:20px}

/* chips & statuses */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:650;white-space:nowrap}
.c-bad{background:var(--bad-bg);color:var(--bad)} .c-warn{background:var(--warn-bg);color:var(--warn)}
.c-ok{background:var(--ok-bg);color:var(--ok)} .c-info{background:var(--accent-bg);color:var(--accent)} .c-na{background:var(--na-bg);color:var(--na)}
.cell{display:inline-block;min-width:34px;text-align:center;border-radius:5px;padding:0 5px;font-weight:650;font-size:12px}

/* attention + changes */
.att{list-style:none;margin:0;padding:0}
.att li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.att li:hover{background:var(--soft)}
.att li:last-child{border-bottom:0}
.att .what{font-weight:600}
.att .where{color:var(--muted);font-size:12.5px}
.att .val{font-weight:700;font-variant-numeric:tabular-nums}
.ok-msg{color:var(--ok);font-weight:650;padding:6px 0}
.changes{list-style:none;margin:0;padding:0}
.changes li{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line)}
.changes li:last-child{border-bottom:0}
.changes .cat{font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);min-width:118px}
.changes .imp{color:var(--bad)}
.changes h4{margin:12px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}

/* tables */
.tw{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:10px}
.tw.nomax{max-height:none}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 9px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;font-size:13px}
thead th{position:sticky;top:0;z-index:2;background:var(--card);font-size:12px;color:var(--muted);font-weight:650}
tbody tr:last-child > td{border-bottom:0}
td.stick,th.stick{position:sticky;left:0;z-index:1;background:var(--card)}
thead th.stick{z-index:3}
tr.row{cursor:pointer}
tr.row:hover > td{background:var(--soft)}
tr.row > td:first-child::before{content:"▸";display:inline-block;width:14px;color:var(--faint);transition:transform .15s}
tr.row.open > td{background:var(--sel)}
tr.row.open > td:first-child{box-shadow:inset 4px 0 0 var(--accent)}
tr.row.open > td:first-child::before{transform:rotate(90deg);color:var(--accent)}
tr.det > td{background:var(--sel-detail);white-space:normal;box-shadow:inset 4px 0 0 var(--accent);border-bottom:2px solid var(--accent);padding:12px 14px}
tr.det table td, tr.det table th{background:transparent}
.sub-h{font-size:12px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.04em;margin:4px 0 6px}
.detgrid{display:grid;grid-template-columns:minmax(260px,1fr) minmax(300px,1.3fr);gap:18px}
@media (max-width:900px){.detgrid{grid-template-columns:1fr}}
a.code{color:var(--accent);text-decoration:none;font-weight:600}
a.code:hover{text-decoration:underline}
.cur{background:var(--accent-bg) !important}

/* bars */
.bars .r{display:grid;grid-template-columns:150px 1fr 70px 70px;gap:8px;align-items:center;margin:4px 0}
.bars .r.nocost{grid-template-columns:150px 1fr 70px}
.bars .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .nm.sub{padding-left:14px;color:var(--muted);font-size:12.5px}
.bars .tr{display:flex;height:12px;border-radius:4px;overflow:hidden;background:var(--soft);gap:2px}
.bars .tr span{display:block;height:100%}
.bars .vv{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);margin:0 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.legend button[aria-pressed="true"]{color:var(--ink);border-color:var(--accent)}
.legend button[aria-pressed="false"] .dot{opacity:.25}

/* periods */
.periods{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;margin:0 0 10px}
.pb{flex:none;border:1px solid var(--line);background:var(--card);border-radius:7px;padding:3px 9px;font-size:12.5px;cursor:pointer}
.pb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}
.pb:disabled{opacity:.35;cursor:default}

/* tabs */
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.tab b{font-variant-numeric:tabular-nums}
.layout-visual .tabs .tab{padding:10px 14px;border-radius:12px;font-size:13px}
.layout-visual .tabs .tab b{display:block;font-size:22px}

/* visual widgets */
.waffle{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 12px}
.waffle i{width:22px;height:22px;border-radius:5px;display:block}
.vcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.vcard{display:flex;flex-direction:column;gap:8px;cursor:pointer}
.vcard:hover{border-color:var(--accent)}
.vcard.open{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.vcard .nm{font-size:16px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.vcard .big{font-size:30px;font-weight:750;line-height:1;font-variant-numeric:tabular-nums}
.vcard .big small{font-size:12.5px;font-weight:500;color:var(--muted);margin-left:6px}
.meter{height:10px;border-radius:5px;background:var(--soft);overflow:hidden;display:flex;gap:2px}
.meter span{display:block;height:100%}
.vdetail{grid-column:1 / -1}
.segbar{display:flex;height:14px;border-radius:5px;overflow:hidden;background:var(--soft);gap:2px}
.segbar span{display:block;height:100%}

/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(5,8,12,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:100%;max-width:1150px;padding:16px}
.mbox.small{max-width:380px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.mhead h3{margin:0;font-size:16px}
.pw input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);margin:8px 0}
.err{color:var(--bad);font-size:12.5px;min-height:18px}

/* trend */
.trend svg text{fill:var(--muted);font-size:11px}
#printHead{display:none}
footer{margin-top:26px;color:var(--faint);font-size:12px;text-align:center}

/* management-only elements */
body:not(.is-mgmt) .mgmt{display:none !important}

/* print: only the selected section, everything expanded stays, no controls, no names */
@media print{
  @page{size:A4 landscape;margin:12mm}
  html,body{background:#fff;color:#000}
  .sticky,.top .controls,.stale,.no-print,button.pdf,.periods button:not([aria-pressed="true"]),.modal,footer{display:none !important}
  body[data-print] main > section:not(.printing),body[data-print] .top{display:none !important}
  #printHead{display:block;margin:0 0 10px;font-size:12px;border-bottom:1px solid #999;padding-bottom:6px}
  #printHead h1{font-size:18px;margin:0 0 4px}
  .card{box-shadow:none;border-color:#bbb;break-inside:avoid}
  .tw{max-height:none !important;overflow:visible !important;border-color:#bbb}
  thead th,td.stick,th.stick{position:static !important}
  .pii{display:none !important}
  tr.row > td:first-child::before{content:""}
  a{color:#000;text-decoration:none}
}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div id="printHead"></div>
  <header class="top">
    <div>
      <h1 id="title"></h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="controls">
      <div class="seg" id="segLayout" role="group"></div>
      <div class="seg" id="segMode" role="group"></div>
      <button class="btn small" id="lockBtn" hidden></button>
      <div class="seg" id="segLang" role="group"></div>
      <button class="btn" id="themeBtn"></button>
    </div>
  </header>
  <div class="stale" id="stale" hidden></div>
  <div class="sticky" id="sticky">
    <nav class="nav" id="nav"></nav>
    <div class="filters" id="filters"></div>
  </div>
  <main id="main">
    <section id="overview"></section>
    <section id="workforce"></section>
    <section id="staffing"></section>
    <section id="hours"></section>
    <section id="requests"></section>
    <section id="alerts"></section>
  </main>
  <footer id="foot"></footer>
</div>

<div class="modal" id="wkModal" hidden role="dialog" aria-modal="true" aria-labelledby="wkTitle">
  <div class="mbox"><div class="mhead"><h3 id="wkTitle"></h3><button class="btn small" id="wkClose">✕</button></div><div id="wkBody"></div></div>
</div>
<div class="modal" id="pwModal" hidden role="dialog" aria-modal="true" aria-labelledby="pwTitle">
  <div class="mbox small pw"><div class="mhead"><h3 id="pwTitle"></h3><button class="btn small" id="pwClose">✕</button></div>
    <form id="pwForm"><label id="pwLabel" for="pwInput"></label><input type="password" id="pwInput" autocomplete="off"><div class="err" id="pwErr"></div>
    <button class="btn" type="submit" id="pwOk"></button></form></div>
</div>

<script>
const D = /*__DATA__*/null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------------- storage ---------------- */
const LS = {
  get(k, d){ try { const v = localStorage.getItem("sidc-v2:" + k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem("sidc-v2:" + k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem("sidc-v2:" + k); } catch(e){} }
};

/* ---------------- i18n ---------------- */

  k_still_n:"in {n} open requests", k_below_n:"of {n} projects with a plan", k_week:"week {w}",

  ch_none:"No important changes since the previous update.", ch_all:"Show all changes", ch_less:"Show fewer",
  cat_workforce:"Workforce", cat_locations:"Work locations", cat_requests:"Manpower requests", cat_staffing:"Staffing plans",
  cat_timesheets:"Timesheets and hours", cat_data:"Data quality", cat_cost:"Estimated labour cost",
  tr_title:"Workforce trend", tr_days:"{n} days", tr_one:"The trend appears after the second daily V2 update.",
  st_Yes:"At work", st_Workshop:"Workshop", st_Scheduled:"Scheduled", st_Home:"At home", st_Other:"Other",
  wf_title:"Workforce", wf_hint:"Active workers only (Active = Yes). Own employees = company marked “PASSER GROUP Company” in Ragic.",
  wf_by_loc:"By work location", wf_by_group:"By position group", loc:"Location", country:"Country", people:"People",
  waffle_unit:"1 square = {n} people",
  sf_title:"Staffing", sf_hint:"Last completed week (W{w}): actual FTE from timesheets vs the project manager’s staffing plan. 40 h = 1 FTE, max 1 FTE per person per week. Current and future weeks show the plan only; manpower requests are listed separately. A missing plan is normal.",
  sf_project:"Project", sf_plan:"Plan", sf_actual:"Actual FTE", sf_ach:"Achieved", sf_short:"Short", sf_status:"Status (W{w})", sf_rep:"Short in last {n} weeks", sf_req:"Related requests still needed",
  sf_below:"Below plan", sf_ok:"As planned", sf_nots:"No timesheets in Ragic", sf_empty:"No staffing plans for the selected filters.",

/* ---------------- state ---------------- */
const S = {
  layout: LS.get("layout", "classic"),
  mode: LS.get("mode", "op"),
  lang: LS.get("lang", "en"),
  trendLines: LS.get("trendLines", ["Yes","Scheduled"]),
  trendDays: LS.get("trendDays", 30),
  period: "total",
  f: {yard:"", country:"", project:"", group:"", own:"", attention:false},
  alertTab: "all",
  open: {},          // expanded rows: key -> period (hours) or true
  attAll: false, chAll: false
};
const t = (k, p = {}) => {
  let s = (I18N[S.lang] && I18N[S.lang][k]) ?? I18N.en[k] ?? k;
  return s.replace(/\{(\w+)\}/g, (_, n) => p[n] ?? "");
};
const loc = () => S.lang === "lt" ? "lt-LT" : "en-GB";
const fmt = n => Number(n || 0).toLocaleString(loc(), {maximumFractionDigits: 0});
const fmt1 = n => Number(n || 0).toLocaleString(loc(), {minimumFractionDigits: 1, maximumFractionDigits: 1});
const eur = n => { n = Number(n || 0); const a = Math.abs(n), L = loc();
  return a >= 1e6 ? "€" + (n/1e6).toLocaleString(L, {maximumFractionDigits: a >= 1e7 ? 1 : 2}) + "M"
       : a >= 1e4 ? "€" + Math.round(n/1e3).toLocaleString(L) + "k" : "€" + fmt(n); };
const eurFull = n => "€" + fmt(n);
const dLong = iso => iso ? new Date(iso + "T00:00:00").toLocaleDateString(loc(), {day:"numeric", month:"short", year:"numeric"}) : "";
const dShort = iso => iso ? new Date(iso + "T00:00:00").toLocaleDateString(loc(), {day:"numeric", month:"short"}) : "";
const mLabel = m => new Date(m + "-01T00:00:00").toLocaleDateString(loc(), {month:"short", year:"2-digit"});
const mLong = m => new Date(m + "-01T00:00:00").toLocaleDateString(loc(), {month:"long", year:"numeric"});
const gName = g => t("g_" + g);
const yd = y => y === D.unassigned_key ? t("unassigned") : y;   // display name of a yard / location
const stName = s => t("st_" + s);
const isMgmt = () => S.mode === "mgmt" && LS.get("mgmtOk", "") === D.mgmt_hash;
const periodLabel = p => p === "total" ? t("hr_period_total") : mLong(D.hours.months[p]);

/* ---------------- data prep ---------------- */
const PEOPLE = D.people.map(a => ({code:a[0], rid:a[1], yard:a[2], project:a[3], country:a[4], group:a[5], position:a[6], status:a[7], own:!!a[8]}));
const HROWS = D.hours.rows.map(r => ({yard:r[0], project:r[1], group:r[2], position:r[3], m:r[4], own:!!r[5], h:r[6], c:r[7], country:(D.yards[r[0]] || "")}));
const REQ = D.requests;
const REQ_BY_ID = Object.fromEntries(REQ.map(r => [r.id, r]));
const STAFF = D.staffing;
const WORKERS = D.workers;
const FLAGS = ["no_ts","mismatch","over12","over60","avg48"];
const WT = ["over12","over60","avg48"];
const STATUS = ["Yes","Workshop","Scheduled","Home"];
const SCOLOR = {Yes:"var(--s-yes)", Workshop:"var(--s-workshop)", Scheduled:"var(--s-scheduled)", Home:"var(--s-home)", Other:"var(--na-bg)"};

/* shared filters: apply only where the relationship exists */
function pass(o, use = {}){
  const f = S.f;
  if (f.yard && use.yard !== false && o.yard !== undefined && o.yard !== f.yard) return false;
  if (f.country && use.country !== false && o.country !== undefined && o.country !== f.country) return false;
  if (f.project && use.project !== false && o.project !== undefined && o.project !== f.project && o.yard !== f.project) return false;
  if (f.group && use.group !== false && o.group !== undefined && o.group !== f.group) return false;
  if (f.own && use.own !== false && o.own !== undefined && (f.own === "own") !== !!o.own) return false;
  return true;
}
const peopleF = () => PEOPLE.filter(p => pass(p));
const workersF = () => WORKERS.filter(w => pass(w) && (!S.f.attention || w.flags.length));
const reqF = () => REQ.filter(r => pass(r, {own:false}) && (!S.f.attention || r.status === "still_needed" || r.status === "reservation_incomplete"));
const staffF = () => STAFF.filter(s => pass(s, {own:false, group:false}) && (!S.f.group || s.groups.some(g => g.group === S.f.group) || s.future.some(w => w.groups[S.f.group]))
                                      && (!S.f.attention || s.below || relStill(s) > 0));
const hoursF = (period = S.period) => HROWS.filter(r => pass(r) && (period === "total" || r.m === period));
const relStill = s => s.requests.map(id => REQ_BY_ID[id]).filter(Boolean).reduce((a, r) => a + r.still, 0);

/* alert evaluation (month-aware for the day/week limits) */
function wFlags(w, period = S.period){
  if (period === "total") return w.flags;
  const m = w.monthly[String(period)] || [0, 0];
  return [m[0] ? "over12" : null, m[1] ? "over60" : null].filter(Boolean);
}
function wDetail(w, f, period = S.period){
  const m = period === "total" ? null : (w.monthly[String(period)] || [0, 0]);
  if (f === "no_ts") return t("d_no_ts", {w: D.last_week.week});
  if (f === "mismatch") return t("d_mismatch", {y: (w.mismatch || []).join(", ")});
  if (f === "over12") return t("d_over12", {n: m ? m[0] : w.days_over, m: fmt1(w.max_day)});
  if (f === "over60") return t("d_over60", {n: m ? m[1] : w.weeks_over});
  if (f === "avg48") return t("d_avg48", {v: fmt1(w.avg16)});
  return "";
}

/* ---------------- header, controls, nav, filters ---------------- */
function segButtons(el, items, active, onPick){
  el.innerHTML = items.map(([k, l]) => `<button type="button" data-k="${k}" aria-pressed="${k === active}">${esc(l)}</button>`).join("");
  el.querySelectorAll("button").forEach(b => b.onclick = () => onPick(b.dataset.k));
}
function renderHeader(){
  document.documentElement.lang = S.lang;
  document.title = t("title") + " · V2";
  $("title").innerHTML = `${esc(t("title"))} <span class="badge">${esc(t("v2"))}</span>`;
  const gen = new Date(D.generated);
  $("meta").innerHTML = `<span class="badge">${esc(t("week"))} ${D.week}</span> &nbsp;${esc(t("snapshot"))}: ${dLong(D.date)} · ${esc(t("updated"))}: ${gen.toLocaleString(loc(), {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"})}`;
  const age = (Date.now() - gen.getTime()) / 36e5;
  $("stale").hidden = age <= 36;
  $("stale").textContent = t("stale", {h: Math.round(age)});
  segButtons($("segLayout"), [["classic", t("classic")], ["visual", t("visual")]], S.layout, k => { S.layout = k; LS.set("layout", k); renderAll(); });
  segButtons($("segMode"), [["op", t("operational")], ["mgmt", t("management")]], isMgmt() ? "mgmt" : "op", k => {
    if (k === "op"){ S.mode = "op"; LS.set("mode", "op"); renderAll(); }
    else if (LS.get("mgmtOk", "") === D.mgmt_hash){ S.mode = "mgmt"; LS.set("mode", "mgmt"); renderAll(); }
    else openPw();

function observeNav(){
  if (navObs) navObs.disconnect();

function renderTrend(){
  const head = `<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center"><h3 style="margin:0;font-size:15px">${esc(t("tr_title"))}</h3>

  const from = new Date(D.date + "T00:00:00"); from.setDate(from.getDate() - S.trendDays);
  const pts = D.trend.filter(p => new Date(p.date + "T00:00:00") >= from);
  if (pts.length < 2) return head + `<p class="muted">${esc(t("tr_one"))} (${pts.length})</p>`;
  const lines = S.trendLines.filter(k => STATUS.includes(k));
  const w = 1100, h = 200, pad = {l:40, r:12, t:12, b:24};
  const all = pts.flatMap(p => lines.map(k => p[k] || 0)), hi = Math.max(1, ...all), lo = 0;
  const X = i => pad.l + i * (w - pad.l - pad.r) / (pts.length - 1), Y = v => pad.t + (h - pad.t - pad.b) * (1 - (v - lo) / (hi - lo || 1));

    ${lines.map(k => `<path d="${pts.map((p, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(p[k] || 0).toFixed(1)}`).join("")}" fill="none" stroke="${SCOLOR[k]}" stroke-width="2"/>

    ${pts.map((p, i) => i % step === 0 || i === pts.length - 1 ? `<text x="${X(i)}" y="${h - 6}" text-anchor="middle">${dShort(p.date)}</text>` : "").join("")}</svg>`;
}

/* ---------------- hours ---------------- */
function yardAgg(rows){
  const Y = {};
  rows.forEach(r => { const y = Y[r.yard] ||= {yard:r.yard, country:r.country, h:0, c:0, projects:{}, groups:{}, positions:{}};
    y.h += r.h; y.c += r.c;
    const p = y.projects[r.project] ||= {h:0, c:0}; p.h += r.h; p.c += r.c;
    const g = y.groups[r.group] ||= {h:0, c:0}; g.h += r.h; g.c += r.c;
    const q = y.positions[r.group + "|" + r.position] ||= {group:r.group, position:r.position, h:0, c:0}; q.h += r.h; q.c += r.c; });
  return Y;
}
function yardAlerts(yard, period){
  return WORKERS.filter(w => w.yard === yard && pass(w, {yard:false, project:false}) && wFlags(w, period).length);
}
function hoursDetail(yard, period){
  const first = D.hours.yard_first[yard] ?? 0, last = D.hours.months.length - 1;
  const has = new Set(HROWS.filter(r => r.yard === yard && pass(r, {yard:false})).map(r => r.m));
  const buttons = `<div class="periods no-print-keep">${[["total", t("hr_period_total")]].concat(D.hours.months.slice(first).map((m, i) => [first + i, mLabel(m)]))
    .map(([k, l]) => `<button class="pb" data-y="${esc(yard)}" data-p="${k}" aria-pressed="${String(period) === String(k)}" ${k === "total" || has.has(k) ? "" : "disabled"}>${esc(l)}</button>`).join("")}</div>`;
  const Y = yardAgg(HROWS.filter(r => r.yard === yard && pass(r, {yard:false}) && (period === "total" || r.m === period)))[yard];
  if (!Y) return buttons + `<p class="muted">${esc(t("hr_none"))}</p>`;
  const projects = Object.entries(Y.projects).sort((a, b) => b[1].h - a[1].h);
  const groups = Object.entries(Y.groups).sort((a, b) => b[1].h - a[1].h);
  const gmax = Math.max(1, ...groups.map(([, v]) => v.h));
  const pos = Object.values(Y.positions);
  const bars = groups.map(([g, v]) => `<div class="r"><div class="nm"><b>${esc(gName(g))}</b></div><div class="tr" title="${fmt(v.h)}"><span style="width:${v.h / gmax * 100}%;background:var(--s-yes)"></span></div><div class="vv">${fmt(v.h)}</div><div class="vv mgmt">${eur(v.c)}</div></div>` +
    pos.filter(p => p.group === g).sort((a, b) => b.h - a.h).map(p => `<div class="r"><div class="nm sub">${esc(p.position)}</div><div class="tr"><span style="width:${p.h / gmax * 100}%;background:var(--s-yes);opacity:.55"></span></div><div class="vv">${fmt(p.h)}</div><div class="vv mgmt">${eur(p.c)}</div></div>`).join("")).join("");
  const al = yardAlerts(yard, period);
  return buttons + `<div style="margin:0 0 10px"><b>${esc(t("hr_sum", {p:periodLabel(period), h:fmt(Y.h)}))}</b><span class="mgmt">${esc(t("hr_sum_cost", {c:eur(Y.c)}))}</span></div>
    <div class="detgrid"><div><div class="sub-h">${esc(t("hr_projects"))}</div><table><thead><tr><th>${esc(t("sf_project"))}</th><th class="num">${esc(t("hr_hours"))}</th><th class="num mgmt">${esc(t("hr_cost"))}</th></tr></thead><tbody>${
      projects.map(([p, v]) => `<tr><td>${esc(p)}</td><td class="num">${fmt(v.h)}</td><td class="num mgmt" title="${eurFull(v.c)}">${eur(v.c)}</td></tr>`).join("")}</tbody></table>
      ${WORKERS.some(w => w.yard === yard) ? `<button class="btn small no-print wkbtn" data-y="${esc(yard)}" data-p="${period}" style="margin-top:10px">${al.length ? `⚠ ${al.length} · ` : ""}${esc(t("hr_workers", {n:WORKERS.filter(w => w.yard === yard).length}))}</button>` : ""}</div>
      <div><div class="sub-h">${esc(t("hr_by_pos"))}</div><div class="bars">${bars}</div></div></div>`;

  $("hours").innerHTML = secHead("hours", t("hr_title"), esc(t("hr_hint")) + note) + chart +
    `<div class="card">${yards.length ? `<div class="tw"><table><thead><tr><th class="stick">${esc(t("hr_yard"))}</th><th>${esc(t("country"))}</th><th class="num">${esc(t("hr_hours"))} · ${esc(periodLabel(S.period))}</th><th class="num mgmt">${esc(t("hr_cost"))}</th><th class="num">${esc(t("hr_projects"))}</th><th>${esc(t("hr_main"))}</th><th class="num">${esc(t("hr_alerts"))}</th></tr></thead><tbody>${rows}</tbody></table></div>` : `<p class="muted">${esc(t("hr_none"))}</p>`}</div>`;

/* ---------------- management password ---------------- */
function openPw(){
  $("pwTitle").textContent = t("pw_title"); $("pwLabel").textContent = t("pw_label"); $("pwOk").textContent = t("pw_ok");
  $("pwErr").textContent = ""; $("pwInput").value = "";
  $("pwModal").hidden = false; $("pwInput").focus();
}
async function sha256(s){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}
$("pwForm").onsubmit = async e => {
  e.preventDefault();
  const h = await sha256($("pwInput").value);
  if (h === D.mgmt_hash){ LS.set("mgmtOk", h); S.mode = "mgmt"; LS.set("mode", "mgmt"); $("pwModal").hidden = true; renderAll(); }
  else $("pwErr").textContent = t("pw_err");
};
$("pwClose").onclick = () => { $("pwModal").hidden = true; };
$("lockBtn").onclick = () => { LS.del("mgmtOk"); S.mode = "op"; LS.set("mode", "op"); renderAll(); };

  const id = b.dataset.sec, sec = $(id);
  const f = S.f, active = [
    f.yard && `${t("f_yard")}: ${f.yard}`, f.country && `${t("f_country")}: ${f.country}`, f.project && `${t("f_project")}: ${f.project}`,
    f.group && `${t("f_group")}: ${gName(f.group)}`, f.own && `${t("f_own")}: ${t(f.own)}`, f.attention && t("f_attention")].filter(Boolean).join(" · ") || t("print_none");
  $("printHead").innerHTML = `<h1>${esc(t("title"))} – ${esc(t("nav_" + id))}</h1>
    ${esc(t("snapshot"))}: ${dLong(D.date)} · ${esc(t("print_period"))}: ${esc(periodLabel(S.period))} · ${esc(t("print_mode"))}: ${esc(isMgmt() ? t("management") : t("operational"))} · ${esc(t("print_lang"))}: ${S.lang.toUpperCase()}<br>${esc(t("print_filters"))}: ${esc(active)}`;
  document.body.dataset.print = id; sec.classList.add("printing");
  const done = () => { delete document.body.dataset.print; sec.classList.remove("printing"); window.removeEventListener("afterprint", done); };
  window.addEventListener("afterprint", done);
  window.print();
  setTimeout(done, 1000);
});

/* ---------------- render ---------------- */
function renderAll(full = true){
  renderHeader();
  renderFilters();
  renderNav();
  renderOverview(); renderWorkforce(); renderStaffing(); renderHours(); renderRequests(); renderAlerts();
}
if (S.mode === "mgmt" && LS.get("mgmtOk", "") !== D.mgmt_hash) S.mode = "op";
renderAll();
</script>
